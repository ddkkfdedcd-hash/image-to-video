<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گۆڕینی وێنە بۆ ڤیدیۆ بە AI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            font-size: 20px;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #bbb;
        }
        input[type="file"], input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background: #2d2d2d;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #6200ee;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #3700b3;
        }
        #result {
            margin-top: 20px;
            text-align: center;
        }
        video {
            width: 100%;
            border-radius: 8px;
            margin-top: 10px;
        }
        .loading {
            color: #ff9800;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>گۆڕینی وێنە بۆ ڤیدیۆ</h2>
        
        <label for="apiKey">کلیلی Replicate API (تۆکێن):</label>
        <input type="password" id="apiKey" placeholder="کلیلی API لێرە دابنە">

        <label for="imageInput">وێنەیەک هەڵبژێرە:</label>
        <input type="file" id="imageInput" accept="image/*">

        <label for="promptInput">پرۆمپت (دەق بۆ وەسفی ڤیدیۆکە):</label>
        <input type="text" id="promptInput" placeholder="بۆ نموونە: Make it move naturally...">

        <button onclick="generateVideo()">دروستکردنی ڤیدیۆ</button>

        <div id="result"></div>
    </div>

    <script>
        async function generateVideo() {
            const apiKey = document.getElementById('apiKey').value;
            const imageInput = document.getElementById('imageInput').files[0];
            const promptText = document.getElementById('promptInput').value;
            const resultDiv = document.getElementById('result');

            if (!apiKey || !imageInput || !promptText) {
                alert('تکایە هەموو خانەکان پڕبکەرەوە (کلیلی API، وێنە، و پرۆمپت).');
                return;
            }

            resultDiv.innerHTML = '<p class="loading">خەریکە ڤیدیۆکە دروست دەبێت، چەند چرکەیەک چاوەڕێ بکە...</p>';

            // لێرەدا دەبێت وێنەکە بۆ لینکێک بەرزبکرێتەوە یان بگوێزڕێتەوە بۆ Base64 بۆ ناردنی بۆ API
            const reader = new FileReader();
            reader.readAsDataURL(imageInput);
            reader.onload = async function () {
                const base64Image = reader.result;

                try {
                    // لێرەدا داواکاری دەنێردرێت بۆ مۆدێلی AI (نموونە: Stable Video Diffusion)
                    const response = await fetch("https://api.replicate.com/v1/predictions", {
                        method: "POST",
                        headers: {
                            "Authorization": `Token ${apiKey}`,
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({
                            // نموونەی مۆدێلی بەناوبانگی SVD بۆ وێنە بۆ ڤیدیۆ
                            version: "3f0457e4619daac51203dedb472816fd4af51f3149fa7a9e0b5ffcf1b8171f38",
                            input: {
                                input_image: base64Image,
                                prompt: promptText
                            }
                        })
                    });

                    const data = await response.json();
                    if(data.id) {
                        checkStatus(data.id, apiKey, resultDiv);
                    } else {
                        resultDiv.innerHTML = `<p style="color:red;">هەڵە ڕوویدا لە ناردنی داواکارییەکە.</p>`;
                    }
                } catch (error) {
                    resultDiv.innerHTML = `<p style="color:red;">هەڵە: ${error.message}</p>`;
                }
            };
        }

        async function checkStatus(predictionId, apiKey, resultDiv) {
            const interval = setInterval(async () => {
                const response = await fetch(`https://api.replicate.com/v1/predictions/${predictionId}`, {
                    headers: {
                        "Authorization": `Token ${apiKey}`
                    }
                });
                const data = await response.json();

                if (data.status === "succeeded") {
                    clearInterval(interval);
                    resultDiv.innerHTML = `<p>ڤیدیۆکە ئامادەیە!</p><video controls src="${data.output}"></video>`;
                } else if (data.status === "failed") {
                    clearInterval(interval);
                    resultDiv.innerHTML = `<p style="color:red;">پرۆسەی دروستکردنی ڤیدیۆکە سەرکەوتوو نەبوو.</p>`;
                }
            }, 3000);
        }
    </script>
</body>
